name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      # Route types (PageProps etc.) are generated, not committed.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:jobdesk

  # Built-HTML metadata contract (#294): canonicals, og:url, titles, card alt
  # text, JSON-LD images, sitemap exclusions for copies, noindex pages.
  rendered:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm run test:rendered

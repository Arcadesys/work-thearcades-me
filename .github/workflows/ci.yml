name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Résumé exports (#51): the renderer and pdftotext let the test suite
      # render real PDFs and check every published fact appears in them.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-resume.txt
      - run: pip install -r requirements-resume.txt
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm run lint
      # Route types (PageProps etc.) are generated, not committed.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run resume:check -- --require-pdf-text
      - run: npm run test:jobdesk

  # Built-HTML metadata contract (#294): canonicals, og:url, titles, card alt
  # text, JSON-LD images, sitemap exclusions for copies, noindex pages.
  rendered:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm run test:rendered

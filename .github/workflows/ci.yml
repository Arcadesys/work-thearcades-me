name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Résumé exports (#51): the renderer and pdftotext let the test suite
      # render real PDFs and check every published fact appears in them.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-resume.txt
      - run: pip install -r requirements-resume.txt
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm run lint
      # Route types (PageProps etc.) are generated, not committed.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run resume:check -- --require-pdf-text
      # Regeneration parity (#52): rebuilding from this revision must reproduce
      # the committed artifacts byte for byte, so renderer or layout changes
      # that were not rebuilt fail here. Drafts build to .resume-drafts/.
      - run: npm run resume:build
      - name: Committed résumé artifacts match a fresh build
        run: git diff --exit-code --stat -- public/resume public/resume.pdf
      - name: Résumé report
        if: always()
        run: |
          git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF:-main}" || true
          npm run -s resume:report -- FETCH_HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Upload résumé editions for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-editions-${{ github.sha }}
          path: |
            public/resume/
            .resume-drafts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - run: npm run test:jobdesk

  # Built-HTML metadata contract (#294): canonicals, og:url, titles, card alt
  # text, JSON-LD images, sitemap exclusions for copies, noindex pages.
  rendered:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm run test:rendered

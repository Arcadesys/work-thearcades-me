<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Idea, build, test, revise</title>
  <desc id="desc">Four large boxes form a clockwise loop. Idea leads to Build, then Test, then Revise. An arrow returns from Revise to Idea for another attempt.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="12" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 2 L12 8 L2 14" fill="none" stroke="#fff4e8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#11121d"/>
      <stop offset="1" stop-color="#241726"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <text x="600" y="100" text-anchor="middle" fill="#fff4e8" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">The cost of trying has changed</text>
  <g fill="#161722" stroke-width="4">
    <rect x="100" y="170" width="410" height="125" rx="24" stroke="#ffb86b"/>
    <rect x="690" y="170" width="410" height="125" rx="24" stroke="#f4a4db"/>
    <rect x="690" y="415" width="410" height="125" rx="24" stroke="#f4a4db"/>
    <rect x="100" y="415" width="410" height="125" rx="24" stroke="#ffb86b"/>
  </g>
  <g fill="#fff4e8" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" text-anchor="middle">
    <text x="305" y="255">Idea</text>
    <text x="895" y="255">Build</text>
    <text x="895" y="500">Test</text>
    <text x="305" y="500">Revise</text>
  </g>
  <g fill="none" stroke="#fff4e8" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M540 232 H660"/>
    <path d="M895 325 V385"/>
    <path d="M660 477 H540"/>
    <path d="M305 385 V325"/>
  </g>
  <text x="600" y="374" text-anchor="middle" fill="#fff4e8" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Repeat</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 60" width="430" height="60">
  <defs>
    <linearGradient id="crescentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8a00"></stop>
      <stop offset="100%" style="stop-color:#ff3cac"></stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <filter id="textglow">
      <feGaussianBlur stdDeviation="0.8" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  
  <g transform="translate(30, 30)" filter="url(#glow)">
    
    <path d="M0,-16 A16,16 0 1,0 0,16 A12,12 0 1,1 0,-16Z" fill="none" stroke="url(#crescentGrad)" stroke-width="3" opacity="0.95"></path>
    
    <circle cx="-2" cy="0" r="6" fill="#ff8a00" opacity="0.15"></circle>
  </g>

  
  <g filter="url(#textglow)">
    <text x="58" y="36" font-family="'Inter', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="2" fill="#ff3cac" opacity="0.95">AUSTEN TUCKER-CROWDER</text>
  </g>
</svg>
